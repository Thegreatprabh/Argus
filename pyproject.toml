[project]
name = "argus"
version = "0.1.0"
description = "ARGUS — an AI-agent reverse engineering platform. Point an agent at any software; get evidence-backed answers about how it works."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prabhjot Singh" }]
keywords = ["reverse-engineering", "mcp", "ai-agents", "security", "analysis"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
full = ["r2pipe", "frida-tools"]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus*"]
