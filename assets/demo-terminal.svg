<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<defs>
<linearGradient id="thead" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1a2230"/><stop offset="100%" stop-color="#11161f"/>
</linearGradient>
</defs>
<rect width="900" height="430" rx="12" fill="#0a0e14" stroke="#1d2635" stroke-width="2"/>
<rect width="900" height="42" rx="12" fill="url(#thead)"/>
<rect y="30" width="900" height="12" fill="url(#thead)"/>
<circle cx="30" cy="21" r="7" fill="#ff5f57"/>
<circle cx="52" cy="21" r="7" fill="#febc2e"/>
<circle cx="74" cy="21" r="7" fill="#28c840"/>
<text x="450" y="27" text-anchor="middle" font-family="monospace" font-size="14" fill="#5b6b82">argus — zsh</text>

<g font-family="'Courier New',monospace" font-size="16">
<text x="24" y="78" fill="#00ff41" opacity="0">$ argus scan-web https://example-shop.com --deep<animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/></text>

<text x="24" y="110" fill="#5b6b82" opacity="0">[●] crawling pages .............. 12 found<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="136" fill="#5b6b82" opacity="0">[●] analyzing JS bundles ........ 8 found<animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="162" fill="#00ff41" opacity="0">[✓] tech stack: Next.js · Tailwind CSS<animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="188" fill="#00ff41" opacity="0">[✓] API endpoints: 23 (auth · products · cart)<animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="214" fill="#b366ff" opacity="0">[✓] trackers: 3 · forms: 2 · evidence attached<animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.3s" fill="freeze"/></text>

<text x="24" y="258" fill="#00ff41" opacity="0">$ argus rebuild https://example-shop.com -o ./myshop --project myshop<animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="290" fill="#5b6b82" opacity="0">[●] blueprint → scaffold .........<animate attributeName="opacity" from="0" to="1" begin="6.0s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="316" fill="#00ff41" opacity="0">[✓] 14 files written → ./myshop/<animate attributeName="opacity" from="0" to="1" begin="6.8s" dur="0.3s" fill="freeze"/></text>
<text x="24" y="342" fill="#b366ff" opacity="0">[✓] starter codebase ready — yours to own<animate attributeName="opacity" from="0" to="1" begin="7.4s" dur="0.3s" fill="freeze"/></text>

<text x="24" y="386" fill="#00ff41" opacity="0">$ <tspan fill="#f2f5f9">▊</tspan><animate attributeName="opacity" from="0" to="1" begin="8.0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" begin="8.3s" repeatCount="indefinite"/></text>
</g>
</svg>
