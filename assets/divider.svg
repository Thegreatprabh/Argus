<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
<defs>
<linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
<stop offset="50%" stop-color="#00ff41" stop-opacity="0.8"/>
<stop offset="100%" stop-color="#b366ff" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<rect x="60" y="11" width="1080" height="2" fill="url(#dg)"/>
<circle cx="600" cy="12" r="5" fill="#00ff41">
<animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
</circle>
</svg>
