<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs>
<radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#b366ff" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#b366ff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
<stop offset="50%" stop-color="#00ff41" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#14202f" stroke-width="1"/>
</pattern>
</defs>

<rect width="1200" height="400" fill="#0a0e14"/>
<rect width="1200" height="400" fill="url(#grid)"/>

<!-- vignette -->
<rect width="1200" height="400" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.25"/>

<!-- EYE -->
<g transform="translate(600,148)">
<circle r="150" fill="url(#eyeglow)"/>
<ellipse rx="120" ry="62" fill="none" stroke="#00ff41" stroke-width="3" opacity="0.9"/>
<ellipse rx="120" ry="62" fill="none" stroke="#b366ff" stroke-width="1.5" opacity="0.5" transform="translate(3,0)"/>
<circle r="34" fill="#0a0e14" stroke="#b366ff" stroke-width="3"/>
<circle r="34" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.6" transform="translate(-2,0)"/>
<circle r="10" fill="#b366ff">
<animate attributeName="r" values="10;13;10" dur="2.4s" repeatCount="indefinite"/>
</circle>
<!-- scan sweep across eye -->
<rect x="-120" y="-62" width="240" height="14" fill="url(#scan)">
<animate attributeName="y" values="-70;48;-70" dur="3.2s" repeatCount="indefinite"/>
</rect>
<!-- radar blips -->
<circle cx="-88" cy="-30" r="4" fill="#00ff41" opacity="0.9">
<animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.8s" repeatCount="indefinite"/>
</circle>
<circle cx="92" cy="26" r="4" fill="#b366ff" opacity="0.9">
<animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" repeatCount="indefinite"/>
</circle>
</g>

<!-- GLITCH TITLE -->
<g font-family="'Courier New',monospace" font-weight="bold" font-size="92" text-anchor="middle">
<text x="603" y="300" fill="#ff004c" opacity="0">ARGUS
<animate attributeName="opacity" values="0;0.7;0;0;0.7;0" dur="4s" repeatCount="indefinite"/>
</text>
<text x="597" y="300" fill="#00e5ff" opacity="0">ARGUS
<animate attributeName="opacity" values="0;0;0.7;0;0.7;0" dur="4s" repeatCount="indefinite"/>
</text>
<text x="600" y="300" fill="#f2f5f9" letter-spacing="18">ARGUS</text>
</g>

<!-- subtitle -->
<text x="600" y="344" text-anchor="middle" font-family="'Courier New',monospace" font-size="21" letter-spacing="6" fill="#00ff41" opacity="0.95">REVERSE-ENGINEER ANYTHING → REBUILD EVERYTHING
<animate attributeName="opacity" values="0.95;0.55;0.95" dur="2.8s" repeatCount="indefinite"/>
</text>

<!-- corner HUD -->
<g font-family="'Courier New',monospace" font-size="14" fill="#00ff41" opacity="0.8">
<text x="24" y="34">[●] SCAN ACTIVE</text>
<text x="24" y="56">ENGINES: 6 ONLINE</text>
<text x="1050" y="34" text-anchor="end">v0.1.0</text>
<text x="1050" y="56" text-anchor="end">MIT // LOCAL-FIRST</text>
</g>
<!-- bottom scanline -->
<rect x="0" y="0" width="1200" height="60" fill="url(#scan)" opacity="0.5">
<animate attributeName="y" values="-60;400;-60" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>
